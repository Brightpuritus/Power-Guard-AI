<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Power Guard AI — วิเคราะห์ความเสี่ยงการใช้ไฟ</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/officer.css" />
  </head>
  <body>
    <!-- เมนูหลักสำหรับสลับหน้าจอการทำงานของเจ้าหน้าที่ -->
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-icon">ϟ</span
        ><span>Power Guard AI<small>ระบบคัดกรองการใช้ไฟฟ้า</small></span></a
      >
      <div class="nav-label">งานตรวจสอบ</div>
      <nav>
        <button data-view="overview"><span>◫</span>ศูนย์ปฏิบัติงาน</button
        ><button data-view="ranking"><span>≡</span>รายการตรวจสอบ</button
        ><button data-view="upload" class="active">
          <span>↥</span>วิเคราะห์ข้อมูลใหม่</button
        ><button data-view="model"><span>◇</span>ข้อมูลโมเดล</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="model-dot"></span> ระบบบันทึกผลตรวจ
        <p>ข้อมูลจัดเก็บภายในเครื่อง</p>
        <div class="local-label">ประมวลผลภายในเครื่อง</div>
      </div>
    </aside>
    <main>
      <header>
        <div class="breadcrumb">
          สำหรับเจ้าหน้าที่ <span>/</span>
          <span id="breadcrumb">วิเคราะห์ข้อมูลใหม่</span>
        </div>
        <div class="header-right">
          <label class="dataset-control"
            >ชุดข้อมูล
            <select id="datasetSelect">
              <option value="">เลือกชุดข้อมูลเพื่อเริ่มงาน</option>
            </select></label
          ><span id="datasetBadge" class="dataset-badge"
            >ยังไม่ได้เลือกข้อมูล</span
          >
        </div>
      </header>
      <div class="content">
        <div id="error" class="error" role="alert" hidden></div>
        <div id="loading" class="loading" role="status" hidden>
          กำลังโหลดข้อมูลจากโมเดล…
        </div>
        <!-- ภาพรวมจำนวนผู้มีความเสี่ยงและสัดส่วนของชุดข้อมูล -->
      <!-- page:overview -->
        <!-- รายการมิเตอร์ ตัวกรอง และสรุปสถานะงานตรวจสอบ -->
      <!-- page:inspection -->
        <!-- เลือกไฟล์ ตั้งชื่อ ตรวจข้อมูล และยืนยันนำเข้า -->
      <!-- page:upload -->
        <!-- อธิบายโมเดล Features และเหตุผลเลือก Threshold -->
      <!-- page:model -->
      </div>
      <footer>
        Power Guard AI <span>ระบบสนับสนุนการตรวจสอบการใช้ไฟฟ้า</span>
      </footer>
    </main>

    <script src="/app.js" defer></script>
    <script src="/pages/overview.js" defer></script>
    <script src="/pages/inspection.js" defer></script>
    <script src="/pages/upload.js" defer></script>
    <script src="/pages/model.js" defer></script>
  </body>
</html>
